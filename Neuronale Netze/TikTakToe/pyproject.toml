[project]
name = "tic-tac-toe"
version = "1.0.0"
description = "Neural network that learns to play tic-tac-toe from a minimax teacher"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests write boards as [X, O, _]; the name O is the mark of player O, not a typo for 0.
"tests/*" = ["E741"]
